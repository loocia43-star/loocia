<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 이름궁합</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 26px;
            color: #ff4b6e;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .input-box label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-box input:focus {
            border-color: #ff4b6e;
        }

        .heart-icon {
            font-size: 24px;
            color: #ff4b6e;
            margin-top: 20px;
        }

        .calc-btn {
            background-color: #ff4b6e;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 75, 110, 0.3);
        }

        .calc-btn:hover {
            background-color: #e03e5d;
        }

        .calc-btn:active {
            transform: scale(0.98);
        }

        .result-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-box {
            font-size: 48px;
            font-weight: bold;
            color: #ff4b6e;
            margin-bottom: 10px;
        }

        .comment-box {
            font-size: 16px;
            color: #444;
            background: #fff5f7;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>💕 두근두근 이름궁합 💕</h1>
        <p class="subtitle">우리 사이의 궁합은 과연 몇 점일까요?</p>

        <div class="input-group">
            <div class="input-box">
                <label for="name1">첫 번째 사람</label>
                <input type="text" id="name1" placeholder="이름 입력">
            </div>
            <div class="heart-icon">💖</div>
            <div class="input-box">
                <label for="name2">두 번째 사람</label>
                <input type="text" id="name2" placeholder="이름 입력">
            </div>
        </div>

        <button class="calc-btn" onclick="calculateCompatibility()">궁합 확인하기</button>

        <div class="result-container" id="resultContainer">
            <div class="score-box" id="scoreText">0%</div>
            <div class="comment-box" id="commentText">결과가 여기에 표시됩니다.</div>
        </div>
    </div>

    <script>
        // 한글 획수 데이터 (초성, 중성, 종성)
        const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','پ','ㅎ'];
        const CHOSUNG_STROKES = [2, 4, 2, 3, 6, 3, 4, 4, 8, 2, 4, 1, 3, 6, 4, 3, 4, 4, 3];
        
        const JUNGSUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
        const JUNGSUNG_STROKES = [2, 3, 3, 4, 2, 3, 3, 4, 3, 4, 5, 4, 3, 3, 4, 5, 4, 3, 1, 2, 1];
        
        const JONGSUNG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        const JONGSUNG_STROKES = [0, 2, 4, 4, 2, 5, 5, 3, 3, 5, 7, 9, 5, 7, 7, 6, 4, 4, 6, 2, 4, 1, 3, 4, 3, 4, 4, 3];

        // 한글 글자 하나를 초/중/종성 획수로 분리하여 합산
        function getCharStrokes(char) {
            const code = char.charCodeAt(0);
            if (code < 44032 || code > 55203) return 5; // 한글이 아니면 기본값 부여

            const base = code - 44032;
            const choIndex = Math.floor(base / 588);
            const jungIndex = Math.floor((base % 588) / 28);
            const jongIndex = base % 28;

            return CHOSUNG_STROKES[choIndex] + JUNGSUNG_STROKES[jungIndex] + JONGSUNG_STROKES[jongIndex];
        }

        // 이름 전체의 획수 배열 반환
        function getNameStrokes(name) {
            let strokes = [];
            for (let i = 0; i < name.length; i++) {
                strokes.push(getCharStrokes(name[i]));
            }
            return strokes;
        }

        // 궁합 계산 로직 (두 이름을 교차 배치하여 획수를 더해가며 점수 도출)
        function calculateCompatibility() {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();

            if (!name1 || !name2) {
                alert('두 사람의 이름을 모두 입력해주세요!');
                return;
            }

            let s1 = getNameStrokes(name1);
            let s2 = getNameStrokes(name2);

            // 두 이름을 번갈아가며 합치기
            let combined = [];
            let maxLength = Math.max(s1.length, s2.length);
            for (let i = 0; i < maxLength; i++) {
                if (i < s1.length) combined.push(s1[i]);
                if (i < s2.length) combined.push(s2[i]);
            }

            // 숫자를 2개씩 더해 새로운 배열 만들기 (이름궁합 전통 알고리즘)
            while (combined.length > 2) {
                let temp = [];
                for (let i = 0; i < combined.length - 1; i++) {
                    temp.push((combined[i] + combined[i+1]) % 10);
                }
                combined = temp;
            }

            let score = combined[0] * 10 + combined[1];
            
            // 0점이 나오거나 너무 낮을 때의 보정 혹은 100점 만점 조정
            if (score === 0) score = 100;
            if (score < 30) score += 30; // 너무 낮으면 재미를 위해 최소 점수 보정

            displayResult(score);
        }

        // 결과 화면 출력 및 코멘트 선정
        function displayResult(score) {
            const resultContainer = document.getElementById('resultContainer');
            const scoreText = document.getElementById('scoreText');
            const commentText = document.getElementById('commentText');

            resultContainer.style.display = 'block';
            scoreText.innerText = `${score}%`;

            let comment = "";
            if (score >= 80) {
                comment = "🔥 불꽃처럼 타오르는 천생연분! 서로 결혼 안하면 불행해짐. 언젠가 만날 운명 💍";
            } else if (score >= 65) {
                comment = "✨ 서로에게 푹 빠져있는 상태! 하지만 자칫 헤어질 수도 있는 운명이니 조심할 필요가 있음 🥰";
            } else if (score >= 30) {
                comment = "💡 서로의 노력이 없다면 만나지 못할 수도.. 상대를 좋아한다면 최선을 다해서 플러팅해야함  🤝";
            } else if (score >= 10) {
                comment = "🤔 서로 성향이 달라서 피해야할 타입. 만나면 저주 걸린거나 다름없음! ☕";
            } else {
                comment = "⛈️ 오늘은 날씨가 흐림...? 하지만 마음먹기에 따라 바뀔 수 있어요! 💪";
            }

            commentText.innerText = comment;
        }
    </script>
</body>
</html>
